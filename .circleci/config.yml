# cspell:words buildx buildkit zstd cimg
version: 2.1

orbs:
  docker: circleci/docker@4.0.1

# Parallel validation pilot. Existing GitHub Actions remain authoritative.
parameters:
  native-pilot-stage:
    type: enum
    enum: [off, php]
    default: off
  run-validation-pilot:
    type: boolean
    default: false
  pilot-resource-class:
    type: enum
    enum: [medium, large, large.gen2]
    default: large
  pilot-docker-layer-caching:
    type: boolean
    default: false

executors:
  docker-host:
    parameters:
      dlc:
        type: boolean
        default: false
    machine:
      image: ubuntu-2404:current
      docker_layer_caching: << parameters.dlc >>
    resource_class: << pipeline.parameters.pilot-resource-class >>

commands:
  inspect-environment:
    steps:
      - run:
          name: Record checkout and Docker environment
          command: |
            git rev-parse HEAD
            nproc
            lscpu
            docker version
            docker buildx version
            docker compose version
      - run:
          name: Install image compression tool
          command: |
            if ! command -v zstd >/dev/null; then
              sudo apt-get update
              sudo apt-get install -y zstd
            fi
  load-test-image:
    steps:
      - attach_workspace:
          at: /tmp/fossbilling-workspace
      - run:
          name: Load shared PHP 8.5 test image
          command: zstd --decompress --stdout /tmp/fossbilling-workspace/test-image-8.5.tar.zst | docker load

jobs:
  native-php-tests:
    docker:
      - image: cimg/php:8.5.10@sha256:7c7ba12e0204ec9b291019a738b4cab3bae2167aaa70c594d6608ec21085c8fe
    resource_class: medium.gen2
    environment:
      APP_ENV: test
      COMPOSER_CACHE_DIR: /home/circleci/.cache/composer
    steps:
      - checkout
      - run:
          name: Record native PHP environment
          command: |
            git rev-parse HEAD
            php --version
            php -m
            composer --version
      - restore_cache:
          keys:
            - v1-native-composer-php85-{{ checksum "composer.lock" }}
      - run:
          name: Install locked PHP dependencies
          command: composer install --prefer-dist --optimize-autoloader --no-interaction --no-progress
      - save_cache:
          key: v1-native-composer-php85-{{ checksum "composer.lock" }}
          paths:
            - /home/circleci/.cache/composer
      - run:
          name: Prepare native test configuration
          command: |
            php -r '$config = require "src/config-sample.php"; file_put_contents("src/config.php", "<?php\nreturn " . var_export($config, true) . ";\n");'
            mkdir -p src/data/cache src/data/log src/data/uploads test-results/unit
      - run:
          name: Native Pest unit and module tests
          command: ./src/vendor/bin/pest --test-directory ../tests --configuration phpunit.xml.dist --ci --log-junit test-results/unit/unit.xml
      - store_test_results:
          path: test-results/unit
      - store_artifacts:
          path: test-results/unit
          destination: native-unit-results

  php-build-test:
    parameters:
      php-version:
        type: enum
        enum: ['8.3', '8.4', '8.5']
      dlc:
        type: boolean
        default: false
    executor:
      name: docker-host
      dlc: << parameters.dlc >>
    environment:
      PHP_VERSION: << parameters.php-version >>
    steps:
      - checkout
      - inspect-environment
      - run:
          name: Select stable Buildx builder for native layer caching
          command: |
            builder="fossbilling-pilot-${PHP_VERSION//./-}"
            if ! docker buildx inspect "$builder" >/dev/null 2>&1; then
              docker buildx create --name "$builder" --driver docker-container
            fi
            docker buildx use "$builder"
      - docker/build:
          step_name: Build Docker test image with Docker orb
          image: fossbilling
          tag: test-${PHP_VERSION}
          use_buildkit: true
          cache_from: type=registry,ref=ghcr.io/fossbilling/fossbilling-build-cache:cache-ci-${PHP_VERSION}
          extra_build_args: >-
            --build-arg=PHP_VERSION=${PHP_VERSION}
            --build-arg=INSTALL_TRANSLATIONS=false
            --load --target=test --progress=plain
          no_output_timeout: 20m
      - when:
          condition:
            equal: ['8.3', << parameters.php-version >>]
          steps:
            - run:
                name: PHPStan
                command: |
                  docker run --rm --env APP_ENV=test "fossbilling:test-${PHP_VERSION}" \
                    ./src/vendor/bin/phpstan analyse --configuration phpstan.neon --memory-limit=512M
      - run:
          name: Pest unit and module tests
          command: |
            mkdir -p test-results/unit
            docker run --rm --env APP_ENV=test \
              --volume "${PWD}/test-results/unit:/test-results" \
              "fossbilling:test-${PHP_VERSION}" \
              ./src/vendor/bin/pest --test-directory ../tests --configuration phpunit.xml.dist --ci \
                --log-junit /test-results/unit.xml
      - store_test_results:
          path: test-results/unit
      - store_artifacts:
          path: test-results/unit
          destination: unit-results
      - when:
          condition:
            equal: ['8.5', << parameters.php-version >>]
          steps:
            - run:
                name: Export shared PHP 8.5 image
                command: |
                  mkdir -p /tmp/fossbilling-workspace
                  docker save fossbilling:test-8.5 | zstd -T0 -6 --stdout > /tmp/fossbilling-workspace/test-image-8.5.tar.zst
            - persist_to_workspace:
                root: /tmp/fossbilling-workspace
                paths:
                  - test-image-8.5.tar.zst

  live-tests:
    executor:
      name: docker-host
    steps:
      - checkout
      - inspect-environment
      - load-test-image
      - run:
          name: Live API tests
          command: |
            FOSSBILLING_TEST_RESULTS_DIR="${PWD}/test-results/live" \
              bash .github/scripts/run-docker-live-tests.sh fossbilling:test-8.5
      - store_test_results:
          path: test-results/live
      - store_artifacts:
          path: test-results/live
          destination: live-results

  playwright-tests:
    executor:
      name: docker-host
    steps:
      - checkout
      - inspect-environment
      - restore_cache:
          keys:
            - v1-circleci-npm-node24-{{ checksum "package-lock.json" }}
      - run:
          name: Typecheck browser tests and build admin assets with Node 24
          command: |
            mkdir -p .circleci/npm-cache
            docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --env npm_config_cache=/npm-cache \
              --volume "${PWD}/.circleci/npm-cache:/npm-cache" \
              --volume "${PWD}:/workspace" --workdir /workspace \
              node:24-bookworm \
              bash -euc 'npm ci --no-audit --no-fund; npm run pw:tsc; NODE_ENV=production npm run build-admin_default'
      - save_cache:
          key: v1-circleci-npm-node24-{{ checksum "package-lock.json" }}
          paths:
            - .circleci/npm-cache
      - load-test-image
      - run:
          name: Playwright tests
          command: bash .github/scripts/run-docker-playwright-tests.sh fossbilling:test-8.5 --reporter=line,junit,html
      - store_test_results:
          path: tests/E2E/Playwright/artifacts/junit
      - store_artifacts:
          path: tests/E2E/Playwright/artifacts
          destination: playwright

workflows:
  native-validation-pilot:
    when:
      equal: [php, << pipeline.parameters.native-pilot-stage >>]
    jobs:
      - native-php-tests
  validation-pilot:
    when: << pipeline.parameters.run-validation-pilot >>
    jobs:
      - php-build-test:
          name: pilot-php-8.3
          php-version: '8.3'
      - php-build-test:
          name: pilot-php-8.4
          php-version: '8.4'
      - php-build-test:
          name: pilot-php-8.5
          php-version: '8.5'
          dlc: << pipeline.parameters.pilot-docker-layer-caching >>
      - live-tests:
          name: pilot-live-tests
          requires: [pilot-php-8.5]
      - playwright-tests:
          name: pilot-playwright-tests
          requires: [pilot-php-8.5]
