# Deny direct access to sensitive project files and directories.
location = /config.php {
    deny all;
}

# Deny PHP scripts that are not web entry points (index.php, ipn.php, installer).
# Exact matches take precedence over the PHP handler regardless of include order.
location = /cron.php {
    deny all;
}

location = /console.php {
    deny all;
}

location = /load.php {
    deny all;
}

location = /di.php {
    deny all;
}

location = /config-sample.php {
    deny all;
}

location = /config.old.php {
    deny all;
}

location = /install/session.php {
    deny all;
}

# Deny code directories. Prefix matches skip the PHP handler.
location ^~ /library/ {
    # Payment gateway adapters ship branding images next to the adapter file
    # (e.g. /library/Payment/Adapter/PayHere/PayHereLogo.png). These are
    # public assets: Apache serves them directly, so allow them here too and
    # keep denying everything else below /library/.
    location ~* ^/library/Payment/Adapter/.+\.(png|jpe?g|gif|svg|webp|avif|ico)$ {
        allow all;
    }

    deny all;
}

location ^~ /modules/ {
    deny all;
}

location ^~ /locale/ {
    deny all;
}

location ^~ /install/sql/ {
    deny all;
}

location ^~ /vendor/ {
    deny all;
}

location ~* ^/themes/(?:[^/]+/)+config/ {
    deny all;
}

location ^~ /data/ {
    deny all;
}

location ~* (?:\.(?:twig|lock|old|ya?ml|htaccess|htpasswd)|~)$ {
    deny all;
}
