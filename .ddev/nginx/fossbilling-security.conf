# Deny direct access to sensitive project files and directories.
location = /config.php {
    return 403;
}

# Deny PHP scripts that are not web entry points (index.php, ipn.php, installer).
# Exact matches take precedence over the PHP handler regardless of include order.
location = /cron.php {
    return 403;
}

location = /console.php {
    return 403;
}

location = /load.php {
    return 403;
}

location = /di.php {
    return 403;
}

location = /config-sample.php {
    return 403;
}

location = /config.old.php {
    return 403;
}

location = /install/session.php {
    return 403;
}

# Deny code directories. Prefix matches skip the PHP handler.
location ^~ /library/ {
    return 403;
}

location ^~ /modules/ {
    return 403;
}

location ^~ /locale/ {
    return 403;
}

location ^~ /install/sql/ {
    return 403;
}

location ^~ /vendor/ {
    return 403;
}

location ~* ^/themes/(?:[^/]+/)+config/ {
    return 403;
}

location ^~ /data/ {
    return 403;
}
