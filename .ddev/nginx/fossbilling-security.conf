# Deny direct access to sensitive project files and directories.
location = /config.php {
    deny all;
}

location ^~ /vendor/ {
    deny all;
}

location ~* ^/themes/[^/]+/config/ {
    deny all;
}

location ^~ /data/ {
    deny all;
}

location ~* (?:\.(?:twig|lock|old|ya?ml|htaccess|htpasswd)|~)$ {
    deny all;
}
