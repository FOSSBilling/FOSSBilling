# General.
api:
  - any:
    - changed-files:
      - any-glob-to-any-file: ["src/library/Api/*", "src/modules/**/Api/*"]

installer:
  - any:
    - changed-files:
      - any-glob-to-any-file: ["src/install/**/*"]

library:
  - any:
    - changed-files:
      - any-glob-to-any-file: ["src/library/**/*"]

modules:
  - any:
    - changed-files:
      - any-glob-to-any-file: ["src/modules/**/**/*"]

# Extensions.
extensions:
  - any:
    - changed-files:
      - any-glob-to-any-file: ["src/extensions/**/*"]

payment-gateways:
  - any:
    - changed-files:
      - any-glob-to-any-file: ["src/extensions/gateways/**/*"]

domain-registrars:
  - any:
    - changed-files:
      - any-glob-to-any-file: ["src/extensions/registrars/**/*"]

server-managers:
  - any:
    - changed-files:
      - any-glob-to-any-file: ["src/extensions/managers/**/*"]

# Front-end/Themes.
client-area:
  - any:
    - changed-files:
    - all-globs-to-any-file: ["!src/themes/admin_*/**/*", "src/modules/**/templates/client/**/*"]
    - all-globs-to-any-file: ["!src/themes/admin_*/**/*", "src/themes/**/*"]

admin-panel:
  - any:
    - changed-files:
      - any-glob-to-any-file: ["src/themes/admin_*/**/*", "src/modules/**/templates/admin/**/*"]

# Github Actions/Config.
github-config:
  - any:
    - changed-files:
      - any-glob-to-any-file: [".github/**/*"]

# Package Management.
composer:
  - any:
    - changed-files:
      - any-glob-to-any-file: ["composer.json", "composer.lock"]

npm:
  - any:
    - changed-files:
      - any-glob-to-any-file: ["package.json", "package-lock.json"]

# Tests/CI.
tests/CI:
  - any:
    - changed-files:
      - any-glob-to-any-file: ["tests/**/*"]
