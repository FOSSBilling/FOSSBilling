name: 'PHP Quality Tools Setup'
description: 'Installs PHP and Composer dependencies, and restores the Rector/PHP-CS-Fixer caches, ready to run code quality tools.'

inputs:
  php-version:
    description: 'The PHP version to use.'
    required: false
    default: '8.3'

runs:
  using: 'composite'
  steps:
    - name: PHP Build
      uses: FOSSBilling/.workflows/.github/actions/php-build@76b4af76fb2a1a2b553ec1c2839044984299a271
      with:
        php-version: ${{ inputs.php-version }}

    # The php-build vendor cache is keyed on composer.lock's hash, which does not
    # change when only composer.json's autoload config changes. On a cache hit the
    # install step is skipped entirely, leaving a stale vendor/autoload.php that
    # can no longer resolve moved/renamed PSR-4 prefixes (e.g. the library-to-core
    # reorganization), so Rector fatals with "class/trait not found" while loading
    # analyzed files. Re-dumping the autoloader from the current composer.json
    # keeps a cached vendor tree consistent with the checked-out sources.
    - name: Refresh Composer Autoloader
      uses: php-actions/composer@v6
      with:
        command: dump-autoload
        php_version: ${{ inputs.php-version }}
        php_extensions: intl

    - name: Set up PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
      with:
        php-version: ${{ inputs.php-version }}
        extensions: intl, xml, dom, curl, iconv, json

    - name: Create Cache Directories
      shell: bash
      run: |
        echo "MONTH=$(date '+%h')" >> "${GITHUB_ENV}"
        mkdir -p cache/rector

    - name: Restore Rector Cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ./cache/rector
        key: ${{ env.MONTH }}-rector
        restore-keys: ${{ env.MONTH }}-rector

    - name: Restore CS-Fixer Cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: .php-cs-fixer.cache
        key: ${{ env.MONTH }}-csfixer
        restore-keys: ${{ env.MONTH }}-csfixer
