name: 'PHP Quality Tools Setup'
description: 'Installs PHP and Composer dependencies, and restores the Rector/PHP-CS-Fixer caches, ready to run code quality tools.'

inputs:
  php-version:
    description: 'The PHP version to use.'
    required: false
    default: '8.3'

runs:
  using: 'composite'
  steps:
    - name: Set up PHP
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
      with:
        php-version: ${{ inputs.php-version }}
        extensions: intl, xml, dom, curl, iconv, json, mbstring, zip
        tools: composer:v2

    - name: Validate Composer Configuration
      shell: bash
      run: composer validate

    - name: Cache Composer Dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ./src/vendor
        key: ${{ runner.os }}-composer-${{ inputs.php-version }}-${{ hashFiles('composer.lock') }}

    # Always install, including on cache hits, to refresh the autoloader after
    # composer.json changes that leave composer.lock unchanged.
    - name: Install Composer Dependencies
      shell: bash
      run: composer install --no-interaction --prefer-dist --no-progress

    - name: Create Cache Directories
      shell: bash
      run: |
        echo "MONTH=$(date '+%h')" >> "${GITHUB_ENV}"
        mkdir -p cache/rector

    - name: Restore Rector Cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ./cache/rector
        key: ${{ env.MONTH }}-rector
        restore-keys: ${{ env.MONTH }}-rector

    - name: Restore CS-Fixer Cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: .php-cs-fixer.cache
        key: ${{ env.MONTH }}-csfixer
        restore-keys: ${{ env.MONTH }}-csfixer
