name: 'PHP Quality Tools Setup'
description: 'Installs PHP and Composer dependencies, and restores the Rector/PHP-CS-Fixer caches, ready to run code quality tools.'

inputs:
  php-version:
    description: 'The PHP version to use.'
    required: false
    default: '8.3'

runs:
  using: 'composite'
  steps:
    - name: PHP Build
      uses: FOSSBilling/.workflows/.github/actions/php-build@76b4af76fb2a1a2b553ec1c2839044984299a271
      with:
        php-version: ${{ inputs.php-version }}

    # The php-build vendor cache is keyed on composer.lock, which doesn't change for
    # autoload-only composer.json edits — a cache hit skips install entirely and leaves a
    # stale vendor/autoload.php that can't resolve moved/renamed PSR-4 prefixes (Rector
    # then fatals with "class/trait not found"). Re-dump it from the current composer.json.
    - name: Refresh Composer Autoloader
      uses: php-actions/composer@v6
      with:
        command: dump-autoload
        php_version: ${{ inputs.php-version }}
        php_extensions: intl

    - name: Set up PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
      with:
        php-version: ${{ inputs.php-version }}
        extensions: intl, xml, dom, curl, iconv, json

    - name: Create Cache Directories
      shell: bash
      run: |
        echo "MONTH=$(date '+%h')" >> "${GITHUB_ENV}"
        mkdir -p cache/rector

    - name: Restore Rector Cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ./cache/rector
        key: ${{ env.MONTH }}-rector
        restore-keys: ${{ env.MONTH }}-rector

    - name: Restore CS-Fixer Cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: .php-cs-fixer.cache
        key: ${{ env.MONTH }}-csfixer
        restore-keys: ${{ env.MONTH }}-csfixer
