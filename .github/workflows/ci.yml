name: CI

permissions:
  contents: read

on:
  push:
  pull_request:
    branches: main
    types: [opened, reopened, synchronize, labeled, unlabeled]
  pull_request_target:
    branches: main
    types: [opened, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && 'labels' || 'run' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  merge-hold:
    name: 'Check for Merge Hold'
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: 'Check merge-hold label'
        run: |
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'merge-hold') }}" == 'true' ]]; then
            echo "Pull request labeled 'merge-hold'"
            echo "The pull request cannot be merged until the 'merge-hold' label is removed."
            exit 1
          fi

          echo "Pull request not labeled 'merge-hold'"
          echo "The pull request can be merged as no 'merge-hold' label is set."

  labeler:
    name: 'Pull Request Labeler'
    permissions:
      contents: read
      pull-requests: write
    if: ${{ github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7
        with:
          repo-token: '${{ secrets.GITHUB_TOKEN }}'
          sync-labels: true

  release-drafter:
    name: 'Release Drafter'
    permissions:
      contents: write
      pull-requests: read
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  spellcheck:
    name: 'Spellcheck'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    if: ${{ (github.event_name == 'pull_request' && github.event.action != 'labeled' && github.event.action != 'unlabeled' && github.event.pull_request.base.repo.id != github.event.pull_request.head.repo.id) || github.event_name == 'push' }}
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 'Perform Spellcheck'
        uses: streetsidesoftware/cspell-action@e0668cf020899e887ee8ad4d173c31738a79eae8 # v9
        with:
          incremental_files_only: true

  php-build-test-pr:
    name: 'PHP Build and Test'
    # Keep PR and push callers separate because job permissions cannot be conditional.
    permissions:
      contents: read
    if: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' && github.event.action != 'unlabeled' && github.event.pull_request.base.repo.id != github.event.pull_request.head.repo.id }}
    uses: ./.github/workflows/php-build-test.yml
    with:
      write-cache: false

  php-build-test-push:
    name: 'PHP Build and Test'
    permissions:
      contents: read
      packages: write
    if: ${{ github.event_name == 'push' }}
    uses: ./.github/workflows/php-build-test.yml
    with:
      # Only main writes the shared registry cache, so concurrent branch pushes don't stomp on it.
      write-cache: ${{ github.ref == 'refs/heads/main' }}

  live-tests-pr:
    name: 'Live Tests'
    permissions:
      contents: read
    needs: [ php-build-test-pr ]
    if: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' && github.event.action != 'unlabeled' && github.event.pull_request.base.repo.id != github.event.pull_request.head.repo.id }}
    uses: ./.github/workflows/live-tests.yml

  live-tests-push:
    name: 'Live Tests'
    permissions:
      contents: read
    needs: [ php-build-test-push ]
    if: ${{ github.event_name == 'push' }}
    uses: ./.github/workflows/live-tests.yml

  playwright-tests-pr:
    name: 'Playwright Tests'
    permissions:
      contents: read
    needs: [ php-build-test-pr ]
    if: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' && github.event.action != 'unlabeled' && github.event.pull_request.base.repo.id != github.event.pull_request.head.repo.id }}
    uses: ./.github/workflows/playwright-tests.yml

  playwright-tests-push:
    name: 'Playwright Tests'
    permissions:
      contents: read
    needs: [ php-build-test-push ]
    if: ${{ github.event_name == 'push' }}
    uses: ./.github/workflows/playwright-tests.yml

  preview-build-pr:
    name: 'Create Preview Build'
    permissions:
      contents: read
    needs: [ live-tests-pr, playwright-tests-pr ]
    if: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' && github.event.action != 'unlabeled' && github.event.pull_request.base.repo.id != github.event.pull_request.head.repo.id }}
    uses: ./.github/workflows/preview-build.yml
    with:
      write-cache: false

  preview-build-push:
    name: 'Create Preview Build'
    permissions:
      contents: read
      packages: write
    needs: [ live-tests-push, playwright-tests-push ]
    if: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}
    uses: ./.github/workflows/preview-build.yml
    with:
      # This job only runs for non-main branches; main's preview-docker job keeps the cache warm.
      write-cache: false

  preview-docker:
    name: 'Build and Push Preview Docker Image'
    permissions:
      contents: read
      packages: write
    needs: [ live-tests-push, playwright-tests-push ]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    uses: ./.github/workflows/docker-build.yml
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    with:
      target: runtime
      cache-scope: cache-preview
      extract-release-tree: true
      release-tree-artifact-name: preview-build
      meta-images: fossbilling/fossbilling
      meta-tags: |
        type=raw,value=preview
      meta-flavor: |
        latest=false
      build-args: |
        FOSSBILLING_VERSION=${{ github.sha }}
        FOSSBILLING_VERSION_TRUNCATE=7
        SENTRY_DSN=${{ vars.SENTRY_DSN }}

  upload-preview:
    name: 'Upload Preview Release'
    permissions:
      contents: read
    needs: [ preview-build-pr, preview-build-push, preview-docker ]
    if: ${{ !cancelled() && (needs['preview-build-pr'].result == 'success' || needs['preview-build-push'].result == 'success' || needs['preview-docker'].result == 'success') }}
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: 'Download Preview Release Archive'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: preview-build
          path: '/tmp'

      - name: 'Extract Preview Release Archive'
        run: |
          mkdir ./src
          tar -xf /tmp/build.tar -C ./src
          rm -f ./src/provenance.json

      - name: 'Create Downloadable Preview'
        run: |
          GITHUB_SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          echo "GITHUB_SHORT_SHA=${GITHUB_SHORT_SHA}" >> "$GITHUB_ENV"
          mkdir -p ../dist
          zip -qr "../dist/FOSSBilling-preview-${GITHUB_SHORT_SHA}.zip" .
          echo "PREVIEW_DIGEST=sha256:$(sha256sum "../dist/FOSSBilling-preview-${GITHUB_SHORT_SHA}.zip" | awk '{print $1}')" >> "$GITHUB_ENV"
        working-directory: ./src/

      - name: 'Upload Downloadable Preview to GitHub'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          if-no-files-found: 'error'
          name: 'FOSSBilling-preview-${{ env.GITHUB_SHORT_SHA }}.zip'
          path: './dist/FOSSBilling-preview-${{ env.GITHUB_SHORT_SHA }}.zip'
          archive: false
          retention-days: 14

      - name: 'Load Secrets for R2 Upload'
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: 1password/load-secrets-action@eb2efd0703da22a93c467f2d1ffbb6826c11e19c # v4.1.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          # Cloudflare R2 (GitHub CI/CD) API credentials stored in 1Password.
          AWS_ACCESS_KEY_ID: op://mkqkefntgcmjlgyxzeaekzuuvq/xddzaoo5rrgl3wg2memaxpcntm/access-key-id
          AWS_SECRET_ACCESS_KEY: op://mkqkefntgcmjlgyxzeaekzuuvq/xddzaoo5rrgl3wg2memaxpcntm/secret-access-key
          CF_R2_ENDPOINT_URL: op://mkqkefntgcmjlgyxzeaekzuuvq/xddzaoo5rrgl3wg2memaxpcntm/endpoint-url

      - name: 'Upload Downloadable Preview to R2'
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          aws s3 cp "./dist/FOSSBilling-preview-${{ env.GITHUB_SHORT_SHA }}.zip" "s3://${CF_R2_DOWNLOAD_BUCKET}/FOSSBilling-preview.zip" \
            --endpoint-url "${CF_R2_ENDPOINT_URL}" \
            --metadata="digest=${{ env.PREVIEW_DIGEST }},commit-sha=${{ github.sha }}" \
            --acl public-read \
            --no-progress
        env:
          CF_R2_DOWNLOAD_BUCKET: ${{ vars.CF_R2_DOWNLOAD_BUCKET }}
          AWS_REGION: 'auto'
