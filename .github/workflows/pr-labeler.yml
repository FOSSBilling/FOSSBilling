name: Pull Request Labeler

on:
  pull_request_target:
    branches: main
    types: [opened, reopened, synchronize]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  labeler:
    name: 'Pull Request Labeler'
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      # Needs pull_request_target to label fork PRs; do not check out or run PR code here.
      # Labeler reads its configuration from the base repository through the API.
      - uses: actions/labeler@v7.0.0
        with:
          sync-labels: true
