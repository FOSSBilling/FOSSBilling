name: Playwright Tests

on:
  workflow_call:

jobs:
  playwright-tests:
    name: 'Playwright Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 'Set up Node'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: 'Typecheck Test Suite'
        run: npm ci --no-audit --no-fund && npm run pw:tsc

      - name: 'Build Admin Widget Assets'
        run: NODE_ENV=production npm run build-admin_default

      - name: 'Set up Docker Compose'
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0

      # Reuses the image already built once in the PHP Build and Test (8.5) job.
      - name: 'Download Test Image Artifact'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: test-image-8.5.tar.zst
          path: /tmp

      - name: 'Load Test Image'
        run: zstd --decompress --stdout /tmp/test-image-8.5.tar.zst | docker load

      - name: 'Run Playwright Tests'
        run: bash ./.github/scripts/run-docker-playwright-tests.sh fossbilling:test-8.5

      - name: 'Upload Playwright Artifacts'
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-artifacts
          if-no-files-found: ignore
          path: |
            tests/E2E/Playwright/artifacts
