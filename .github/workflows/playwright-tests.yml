name: Playwright Tests

on:
  workflow_call:

jobs:
  playwright-tests:
    name: 'Playwright Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 'Set up Node'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: 'Typecheck Test Suite'
        run: npm ci --no-audit --no-fund && npm run pw:tsc

      - name: 'Set up Docker Compose'
        uses: docker/setup-compose-action@4eb059ff7f16592f9c84d5ca339c53cb7c5064e2 # v2.3.0

      # Reuses the image already built once in the PHP Build and Test (8.5) job.
      - name: 'Download Test Image Artifact'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: test-image-8.5.tar.zst
          path: /tmp

      - name: 'Load Test Image'
        run: zstd --decompress --stdout /tmp/test-image-8.5.tar.zst | docker load

      - name: 'Run Playwright Tests'
        run: bash ./.github/scripts/run-docker-playwright-tests.sh fossbilling:test-8.5

      - name: 'Upload Playwright Artifacts'
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-artifacts
          if-no-files-found: ignore
          path: |
            tests/E2E/Playwright/artifacts
