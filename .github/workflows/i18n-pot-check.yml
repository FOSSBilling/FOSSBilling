name: Translation Source Check

on:
  pull_request:
    paths:
      - 'src/**/*.php'
      - 'src/**/*.twig'
      - '.github/scripts/extract_pot.py'
      - '.github/workflows/i18n-pot-check.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  pot-diff:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: 'Checkout PR head'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 'Extract msgids (head)'
        run: python3 .github/scripts/extract_pot.py src /tmp/head.pot

      - name: 'Extract msgids (base)'
        run: |
          git worktree add /tmp/base "${{ github.event.pull_request.base.sha }}"
          python3 .github/scripts/extract_pot.py /tmp/base/src /tmp/base.pot
          git worktree remove --force /tmp/base

      - name: 'Compare'
        id: diff
        run: |
          python3 .github/scripts/extract_pot.py --diff /tmp/base.pot /tmp/head.pot > /tmp/pot-diff.txt 2>&1 || true
          {
            echo 'body<<EOF'
            cat /tmp/pot-diff.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: 'Comment on PR'
        # Fork PRs get a read-only token, so commenting may fail there;
        # the extraction result above is still visible in the job log.
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          POT_DIFF: ${{ steps.diff.outputs.body }}
        with:
          script: |
            const marker = '<!-- fossbilling-i18n-pot-diff -->';
            const diff = (process.env.POT_DIFF || '').trim() || '(no output)';
            const body = `${marker}\n### Translation Source Check\n\n` +
              `How this PR changes the gettext msgid set ` +
              `(casing-only changes silently invalidate existing translations):\n\n` +
              '```\n' + diff + '\n```\n\n' +
              `_Informational only. The .pot is regenerated by the scheduled job in FOSSBilling/locale._`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
