name: Translation source check

# Informational only — never blocks. Reports how a PR changes the gettext
# msgid set (new / dropped / casing-only changes), so authors can see when
# they invalidate existing translations. The .pot itself is regenerated by
# the scheduled job in FOSSBilling/locale (see .github/scripts/extract_pot.py).

on:
  pull_request:
    paths:
      - 'src/**/*.php'
      - 'src/**/*.twig'
      - '.github/scripts/extract_pot.py'
      - '.github/workflows/i18n-pot-check.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  pot-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Extract msgids (head)
        run: python3 .github/scripts/extract_pot.py src /tmp/head.pot

      - name: Extract msgids (base)
        run: |
          git worktree add /tmp/base "${{ github.event.pull_request.base.sha }}"
          python3 .github/scripts/extract_pot.py /tmp/base/src /tmp/base.pot
          git worktree remove --force /tmp/base

      - name: Compare
        id: diff
        run: |
          python3 .github/scripts/extract_pot.py --diff /tmp/base.pot /tmp/head.pot > /tmp/pot-diff.txt 2>&1 || true
          {
            echo 'body<<EOF'
            cat /tmp/pot-diff.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb6c721942fccf # v7
        with:
          script: |
            const marker = '<!-- fossbilling-i18n-pot-diff -->';
            const diff = `${{ steps.diff.outputs.body }}`.trim() || '(no output)';
            const body = `${marker}\n### Translation source check\n\n` +
              `How this PR changes the gettext msgid set ` +
              `(casing-only changes silently invalidate existing translations):\n\n` +
              '```\n' + diff + '\n```\n\n' +
              `_Informational only. The .pot is regenerated by the scheduled job in FOSSBilling/locale._`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
