name: Fix Code Quality & Styling

on:
  schedule:
    - cron: "0 12 * * 2,4" # Runs once every Tuesday and Thursday
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-chore-cs-fix
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fix-cs:
    name: Rector & PHP-CS-Fixer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set Up PHP Quality Tools
        uses: ./.github/actions/php-quality-setup
        with:
          php-version: 8.3

      - name: Run Rector
        id: rector
        run: composer rector:fix

      - name: Run PHP-CS-Fixer
        id: php_cs_fixer
        run: composer cs:fix

      - name: Configure Git Identity
        run: |
          git config user.name "FOSSBilling Bot"
          git config user.email "fossbilling-bot"

      - name: 'Load Secrets for FOSSBilling Bot'
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          # FOSSBilling Bot (GitHub CI/CD) credentials stored in 1Password.
          GH_TOKEN: op://mkqkefntgcmjlgyxzeaekzuuvq/yyxe5dc4jyw45h2pagqhl7576i/credential

      # Registers `gh` as git's credential helper for github.com, so the
      # plain `git push` below authenticates using GH_TOKEN above.
      - name: Authenticate Git via gh
        run: gh auth setup-git

      - name: Commit and Push Changes
        id: push_changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit."
            exit 0
          fi

          git add -A
          git commit -m "Apply PHP Code Styling & Quality Changes"

          # chore/cs-fix is fully regenerated every run, so history isn't
          # preserved between runs — --force-with-lease still guards
          # against clobbering a remote branch that moved unexpectedly
          # (e.g. a reviewer pushed changes to the open PR).
          git fetch origin '+refs/heads/chore/cs-fix:refs/remotes/origin/chore/cs-fix' 2>/dev/null || true
          git push --force-with-lease origin HEAD:refs/heads/chore/cs-fix
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create or Update Pull Request
        id: create_pr
        if: steps.push_changes.outputs.changed == 'true'
        run: |
          existing_pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head chore/cs-fix --base main --state open --json number -q '.[0].number')

          if [ -n "$existing_pr" ]; then
            gh pr view "$existing_pr" --repo "$GITHUB_REPOSITORY" --json url -q '"url=" + .url' >> "$GITHUB_OUTPUT"
            echo "Pull request #$existing_pr already open; push updated it."
          else
            url=$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --title "Apply PHP Code Styling & Quality Changes" \
              --body "Automated run of PHP-CS-Fixer and Rector to ensure code styling, quality, and modern practices." \
              --base main \
              --head chore/cs-fix \
              --label skip-changelog)
            echo "url=$url" >> "$GITHUB_OUTPUT"
          fi

      - name: Write Job Summary
        if: always()
        run: |
          cat >> "${GITHUB_STEP_SUMMARY}" <<'EOF'
          ## Code Quality and Styling

          | Item | Value |
          | --- | --- |
          | PHP version | `8.3` |
          | Rector | `${{ steps.rector.outcome }}` |
          | PHP-CS-Fixer | `${{ steps.php_cs_fixer.outcome }}` |
          | Changes pushed | `${{ steps.push_changes.outputs.changed || 'false' }}` |
          | Pull request | `${{ steps.create_pr.outputs.url || 'No changes' }}` |
          EOF
