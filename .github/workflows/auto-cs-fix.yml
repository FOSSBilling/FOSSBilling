name: Fix Code Quality & Styling

on:
  schedule:
    - cron: "0 12 * * 2,4" # Runs once every Tuesday and Thursday
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-chore-cs-fix
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  fix-cs:
    name: Rector & PHP-CS-Fixer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set Up PHP Quality Tools
        uses: ./.github/actions/php-quality-setup
        with:
          php-version: 8.3

      - name: Run Rector
        id: rector
        run: composer rector:fix

      - name: Run PHP-CS-Fixer
        id: php_cs_fixer
        run: composer cs:fix

      - name: Create Pull Request
        id: create_pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          title: Apply PHP Code Styling & Quality Changes
          commit-message: Apply PHP Code Styling & Quality Changes
          branch: chore/cs-fix
          body: Automated run of PHP-CS-Fixer and Rector to ensure code styling, quality, and modern practices.
          delete-branch: true
          token: ${{ secrets.FOSSBILLING_BOT_TOKEN }}
          committer: FOSSBilling Bot <fossbilling-bot>
          author: FOSSBilling Bot <fossbilling-bot>
          labels: skip-changelog

      - name: Write Job Summary
        if: always()
        run: |
          cat >> "${GITHUB_STEP_SUMMARY}" <<'EOF'
          ## Code Quality and Styling

          | Item | Value |
          | --- | --- |
          | PHP version | `8.3` |
          | Rector | `${{ steps.rector.outcome }}` |
          | PHP-CS-Fixer | `${{ steps.php_cs_fixer.outcome }}` |
          | Pull request action | `${{ steps.create_pr.outcome }}` |
          | Pull request | `${{ steps.create_pr.outputs.pull-request-url || 'No changes' }}` |
          EOF
